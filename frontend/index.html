<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícias | IFMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <span class="marca-sistema">IFMS // Portal de Notícias</span>
            <nav class="menu">
                <a href="index.html">Notícias</a>
                <a href="perfil.html">Perfil</a>
                <a href="cadastro.html">Entrar</a>
            </nav>
        </div>
    </header>

    <main class="main-layout">
        <section class="card-formulario">
            <h2>Publicar Notícia</h2>
            <p id="avisoPublicar" class="subtitulo-secao">
                Só representantes de sala e servidores publicam. Entre na sua conta para comentar.
            </p>

            <form id="postForm" onsubmit="publicar(event)" hidden>
                <div class="input-grupo">
                    <label for="title">Título</label>
                    <input type="text" id="title" required>
                </div>
                <div class="input-grupo">
                    <label for="content">Conteúdo</label>
                    <textarea id="content" required></textarea>
                </div>
                <div class="input-grupo">
                    <label for="tags">Tags</label>
                    <input type="text" id="tags" placeholder="Ex: eventos, esporte, avisos">
                </div>
                <button type="submit" class="btn-primario">Publicar</button>
            </form>
        </section>

        <section class="feed-secao">
            <h2>Mural de Avisos</h2>
            <form class="tag-search-form" onsubmit="buscar(event)">
                <label for="tagSearch">Pesquisar por tag</label>
                <div class="tag-search-controls">
                    <input type="search" id="tagSearch" placeholder="Ex: eventos">
                    <button type="submit" class="btn-primario">Pesquisar</button>
                    <button type="button" class="btn-secundario" onclick="limparBusca()">Limpar</button>
                </div>
            </form>
            <div id="postsList" class="lista-posts"></div>
        </section>
    </main>

    <script src="comum.js"></script>
    <script src="script.js"></script>
</body>
</html>
